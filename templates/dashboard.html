<!DOCTYPE html>
<html lang="it">
    
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS Personalizzato -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <span class="navbar-brand mb-0 h5">
            🏁 Kart Manager
        </span>
        <a href="/logout" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</nav>

<div class="container py-5">

    <!-- Welcome Box -->
    <div class="welcome-box mb-5">
        <h3 class="mb-2">Dashboard</h3>
        <p class="mb-0 text-muted">
            Utente: <strong>{{ username }}</strong> |
            Sede: <strong>{{ location }}</strong>
        </p>
    </div>

    <div class="row g-4">

        <!-- Riparazioni -->
        <div class="col-md-6 col-lg-3">
            <a href="/repairs" class="text-decoration-none">
                <div class="card dashboard-card text-center p-4 bg-white">
                    <div class="dashboard-icon text-primary">
                        <i class="bi bi-tools"></i>
                    </div>
                    <h5 class="fw-semibold text-dark">Gestione Riparazioni</h5>
                </div>
            </a>
        </div>

        <!-- Kart -->
        <div class="col-md-6 col-lg-3">
            <a href="/karts" class="text-decoration-none">
                <div class="card dashboard-card text-center p-4 bg-white">
                    <div class="dashboard-icon text-danger">
                        <i class="bi bi-speedometer2"></i>
                    </div>
                    <h5 class="fw-semibold text-dark">Gestione Kart</h5>
                </div>
            </a>
        </div>

        <!-- Pezzi -->
        <div class="col-md-6 col-lg-3">
            <a href="/pieces" class="text-decoration-none">
                <div class="card dashboard-card text-center p-4 bg-white">
                    <div class="dashboard-icon text-success">
                        <i class="bi bi-puzzle"></i>
                    </div>
                    <h5 class="fw-semibold text-dark">Gestione Pezzi</h5>
                </div>
            </a>
        </div>

        <!-- Utenti solo admin -->
        {% if role == 0 %}
        <div class="col-md-6 col-lg-3">
            <a href="/users" class="text-decoration-none">
                <div class="card dashboard-card text-center p-4 bg-warning bg-opacity-25">
                    <div class="dashboard-icon text-warning">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <h5 class="fw-semibold text-dark">Gestione Utenti</h5>
                </div>
            </a>
        </div>
        {% endif %}

    </div>

</div>

<footer class="text-center py-4 footer">
    © 2026 Kart Manager - Sistema Gestionale Interno
</footer>

</body>
</html>
