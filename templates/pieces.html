{% extends "base.html" %}
{% block content %}

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<div class="container py-4">

    <h3 class="mb-4">🔧 Gestione Pezzi</h3>

    <!-- FORM CREAZIONE -->
    <div class="card p-4 mb-4">
        <form method="POST">
            <div class="row g-3">

                <div class="col-md-3">
                    <input type="text" name="name" class="form-control" placeholder="Nome pezzo" required>
                </div>

                <div class="col-md-2">
                    <input type="text" name="model" class="form-control" placeholder="Modello">
                </div>

                <div class="col-md-2">
                    <input type="number" name="quantity" class="form-control" placeholder="Quantità">
                </div>

                <div class="col-md-3">
                    <input type="text" name="note" class="form-control" placeholder="Nota">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Aggiungi</button>
                </div>

            </div>
        </form>
    </div>


    <!-- FILTRO -->
    <div class="card p-3 mb-4">
        <form method="GET">

            <div class="row g-2">

                <div class="col-md-3">
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Nome pezzo"
                           value="{{ request.args.get('name','') }}">
                </div>

                <div class="col-md-3">
                    <input type="text"
                           name="model"
                           class="form-control"
                           placeholder="Modello"
                           value="{{ request.args.get('model','') }}">
                </div>

                <div class="col-md-3">

                    <select name="status" class="form-select">

                        <option value=""
                        {% if not request.args.get('status') %}selected{% endif %}>
                        Tutti</option>

                        <option value="1"
                        {% if request.args.get('status') == '1' %}selected{% endif %}>
                        Da ordinare
                        </option>

                        <option value="0"
                        {% if request.args.get('status') == '0' %}selected{% endif %}>
                        Disponibili
                        </option>

                    </select>

                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        Filtra
                    </button>
                </div>

                <div class="col-md-1">
                    <a href="{{ url_for('pieces.pieces') }}" class="btn btn-secondary w-100">
                        Reset
                    </a>
                </div>

            </div>

        </form>
    </div>


    <!-- TABELLA -->
    <div class="card p-4">

        <table id="piecesTable" class="table table-hover align-middle">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Modello</th>
                    <th>Quantità</th>
                    <th>Stato</th>
                    <th>Nota</th>
                    <th width="200">Azioni</th>
                </tr>
            </thead>

            <tbody>

                {% for piece in pieces %}
                <tr>

                    <form method="POST"
                          action="{{ url_for('pieces.update_piece', piece_id=piece.piece_id) }}">

                        <td>
                            <input type="text"
                                   name="name"
                                   value="{{ piece.piece_name }}"
                                   class="form-control">
                        </td>

                        <td>
                            <input type="text"
                                   name="model"
                                   value="{{ piece.piece_model }}"
                                   class="form-control">
                        </td>

                        <td>
                            <input type="number"
                                   name="quantity"
                                   value="{{ piece.piece_quantity }}"
                                   class="form-control">
                        </td>

                        <td>
                            <select name="status" class="form-select">

                                <option value="0"
                                {% if piece.piece_status == 0 %}selected{% endif %}>
                                Disponibile
                                </option>

                                <option value="1"
                                {% if piece.piece_status == 1 %}selected{% endif %}>
                                Da ordinare
                                </option>

                            </select>
                        </td>

                        <td>
                            <input type="text"
                                   name="note"
                                   value="{{ piece.piece_note }}"
                                   class="form-control">
                        </td>

                        <td class="d-flex gap-2">

                            <button class="btn btn-success btn-sm">
                                Salva
                            </button>

                    </form>

                    <form method="POST"
                          action="{{ url_for('pieces.delete_piece', piece_id=piece.piece_id) }}">

                        <button class="btn btn-danger btn-sm">
                            Elimina
                        </button>

                    </form>

                        </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

    <div class="mt-3">
        <a href="{{ url_for('dashboard.dashboard') }}">← Torna alla Dashboard</a>
    </div>

</div>


<!-- JQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>

$(document).ready(function () {

    $('#piecesTable').DataTable({

        pageLength: 25,

        language: {
            url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/it-IT.json"
        }

    });

});

</script>

{% endblock %}
